spring.datasource.url=jdbc:h2:mem:phonestore;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ptv_mobile}
app.catalog.seed-enabled=true
app.admin.username=admin
app.admin.password=Admin123!
# Spring AI OpenAI (Module AI - Tài)
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder}
spring.ai.openai.chat.enabled=${OPENAI_ENABLED:false}
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.moderation.enabled=false
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=500

# Vector DB & Recommendation (Module Recommendation - Vi)
app.milvus.enabled=${MILVUS_ENABLED:false}
app.milvus.host=${MILVUS_HOST:localhost}
app.milvus.port=${MILVUS_PORT:19530}
app.milvus.collection=product_embeddings
app.milvus.dimension=1536
app.recommendation.reindex-enabled=false
app.recommendation.index-on-startup=false
