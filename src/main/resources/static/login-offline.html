<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập PTV Mobile</title>
  <style>
    body { margin: 0; padding: 1rem; background: #eef4fb; color: #182c48; font: 1rem system-ui, sans-serif; }
    main { max-width: 32rem; margin: 10vh auto; padding: 1.5rem; border-radius: 1rem; background: white; }
    label, input { display: block; }
    input { box-sizing: border-box; margin-top: .35rem; width: 100%; padding: .65rem; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Đăng nhập PTV Mobile</h1>
    <p>Bạn đang ngoại tuyến. Kết nối lại để đăng nhập hoặc tiếp tục phiên làm việc.</p>
    <label for="username">Tên tài khoản đã nhớ</label>
    <input id="username" autocomplete="username" readonly>
    <p><a href="login">Thử kết nối lại</a></p>
  </main>
  <script src="js/login-account.js" defer></script>
</body>
</html>
