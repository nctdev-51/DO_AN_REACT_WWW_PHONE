# Local MariaDB development. Copy .env.example to .env and export its values before running.
spring.datasource.url=jdbc:mariadb://localhost:3306/webshop_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mariadb
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ptv_mobile}
app.catalog.seed-enabled=true
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# --- Cau hinh Spring AI (Module cua Tai) ---
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder}
spring.ai.openai.chat.enabled=true
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.max-tokens=1500

# --- Tat kiem tra ket noi Mail khi chay dev (tranh bao loi no password specified) ---
spring.mail.test-connection=false
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,caches,threaddump
spring.main.lazy-initialization=${DEV_LAZY_INITIALIZATION:false}

# Vector DB & Recommendation (Module Recommendation - Vi)
app.milvus.enabled=${MILVUS_ENABLED:false}
app.milvus.host=${MILVUS_HOST:localhost}
app.milvus.port=${MILVUS_PORT:19530}
app.milvus.collection=product_embeddings
app.milvus.dimension=1536
app.recommendation.reindex-enabled=${RECOMMENDATION_REINDEX_ENABLED:false}
app.recommendation.index-on-startup=${RECOMMENDATION_INDEX_ON_STARTUP:false}
