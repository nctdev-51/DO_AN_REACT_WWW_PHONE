# Local MariaDB development. Copy .env.example to .env and export its values before running.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/webshop_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:webshop_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mariadb
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.catalog.seed-enabled=true
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
