# Production has no credential defaults. ProductionConfigurationValidator fails before startup
# when the required environment variables are absent.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mariadb
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.catalog.seed-enabled=false
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.public-base-url=${PUBLIC_BASE_URL}
