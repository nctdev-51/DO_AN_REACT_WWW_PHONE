server.port=8080
spring.profiles.default=local

# View resolver cho JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Ket noi MariaDB
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/webshop_db}
spring.datasource.username=${DB_USERNAME:webshop_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Tu dong cap nhat bang
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cau hinh Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@ptvmobile.local}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=64MB
server.tomcat.max-part-count=140
app.upload.dir=${UPLOAD_DIR:uploads/products}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# VNPay sandbox: enabled only after providing local merchant credentials.
app.vnpay.enabled=${VNPAY_ENABLED:false}
app.vnpay.terminal=${VNPAY_TMN_CODE:}
app.vnpay.secret=${VNPAY_HASH_SECRET:}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
app.catalog.seed-enabled=${CATALOG_SEED_ENABLED:true}
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Carrier calls are disabled until configured. Staging is the default environment.
app.ghn.enabled=${GHN_ENABLED:false}
app.ghn.production=${GHN_PRODUCTION:false}
app.ghn.token=${GHN_TOKEN:}
app.ghn.shop-id=${GHN_SHOP_ID:0}
